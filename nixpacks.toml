# Railway build config. Two independent npm packages (backend/, frontend/), no root
# package.json or workspaces — building each in place rather than restructuring the repo
# for this. Backend serves the built frontend directly in production (see
# backend/src/server.ts's static-file block), so both have to be built before start.

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["cd frontend && npm ci", "cd backend && npm ci"]

[phases.build]
cmds = ["cd frontend && npm run build", "cd backend && npm run build"]

[start]
cmd = "cd backend && npm start"
