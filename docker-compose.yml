services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-org-mesh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_org_mesh
      POSTGRES_USER: mesh_admin
      POSTGRES_PASSWORD: mesh_admin_dev_only
    ports:
      # host 5433 -> container 5432; 5432 is already taken by a local Postgres install
      - '5433:5432'
    volumes:
      - agent-org-mesh-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mesh_admin -d agent_org_mesh']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agent-org-mesh-db-data:
